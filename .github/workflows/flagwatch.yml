name: flagwatch

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flagwatch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Collect flag changes
        env:
          REPORT_BASE_URL: ${{ github.server_url }}/${{ github.repository }}/blob/main
        run: python3 flagwatch.py

      - name: Job summary
        run: |
          {
            echo "## $(cat last_run.title)"
            echo
            cat last_run.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit
        run: |
          if [ -z "$(git status --porcelain reports state)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports state last_run.json last_run.md last_run.title
          git commit -m "flags: $(cat last_run.title)"
          git push
